<!-- ==========================================================================
     MathJax 3
     --------------------------------------------------------------------------
     kramdown renders math into <script type="math/tex"> tags, which MathJax 2
     understood natively and MathJax 3 does not. pageReady rewrites them into
     \(…\) / \[…\] before the first typeset, so both kramdown's $$…$$ and raw
     $…$ written straight into the page work.
     ========================================================================== -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams',
      macros: {
        R: '{\\mathbb{R}}',
        E: '{\\mathbb{E}}',
        argmax: '{\\operatorname{arg\\,max}}',
        argmin: '{\\operatorname{arg\\,min}}'
      }
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'annotation', 'annotation-xml'],
      ignoreHtmlClass: 'no-mathjax',
      menuOptions: { settings: { inTabOrder: false } }
    },
    chtml: {
      scale: 1.0,
      matchFontHeight: true
    },
    startup: {
      pageReady: function () {
        var nodes = document.querySelectorAll('script[type^="math/tex"]');
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          var display = el.type.indexOf('mode=display') > -1;
          var tex = el.textContent;
          var box = document.createElement(display ? 'div' : 'span');
          box.className = display ? 'math-display' : 'math-inline';
          box.textContent = display ? '\\[' + tex + '\\]' : '\\(' + tex + '\\)';
          el.parentNode.replaceChild(box, el);
        }
        return window.MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
